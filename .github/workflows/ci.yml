name: CI (offline verify + builds)

on:
  push:
    branches: [main, windows]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同 ref 连续 push 只跑最新（2026-08-31 用户决策：批量 push 节奏下防排队堆积）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Offline suite + builds (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python deps (pinned fhlmi/litellm + vendored paper-qa)
        env:
          # vendored paper-qa 无 .git 元数据，setuptools-scm 需显式版本
          SETUPTOOLS_SCM_PRETEND_VERSION: "2026.1.6.dev10+g36348d0ca"
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          pip install "fhlmi==0.42.1" "litellm==1.76.1"
          pip install -e ./paper-qa
          pip install -e "./paper-qa/packages/paper-qa-pypdf[media]"
          pip install -e ./paper-qa/packages/paper-qa-pymupdf
          pip install -r requirements-windows.txt

      - name: Install Graphviz (verify_smoke renders DOT via local Graphviz; cold runner lacks dot)
        run: choco install graphviz -y --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Offline verify suite
        env:
          PYTHONUTF8: "1"
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # TG-5（Sprint-16）：改为经分层 runner 跑 **整个 offline 档**（按 VERIFY_META.tier 自动选择，
          # fail-closed：任一脚本失败即整体失败）——修复此前"新增 offline 脚本忘记登记进 CI"的覆盖缺口
          # （Sprint-15 的 local_dir/f12_preview 与 Sprint-16 的 archive/checkpoint/providers/runner 均因此未进 CI）。
          python verify/run_suite.py --tier offline
          # 矩阵防漂移必须独立执行（verify_matrix.py 自身不参与 tier 选择）
          python verify/verify_matrix.py check

      - name: Close-readiness gate for sprints that claim closure (TG-11)
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # TG-11 ③b/M4：**谁声称已关闭，谁就必须自证**——只校验**真的写了锚点 sha** 的 Sprint 文档
          # （D4：不对历史 Sprint 文档追溯；占位文字如"三查锚点: 待填"不算声明，故用正则而非关键词匹配）。
          $pat = '三查锚点\s*[:：]\s*`?[0-9a-fA-F]{7,40}'
          $checked = 0
          foreach ($f in Get-ChildItem docs/iteration/sprint/*sprint-*.md) {
            if (Select-String -Path $f.FullName -Pattern $pat -Quiet) {
              Write-Host "close-readiness -> $($f.Name)"
              python verify/verify_close_readiness.py --sprint $f.FullName
              $checked++
            }
          }
          Write-Host "close-readiness: checked $checked sprint doc(s) declaring a real anchor"

      - name: Explicit gate tiers (card index / md tables / policy hardcode / lint / structure guard)
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # A3（finding M-e/M-f/N7，2026-09-25）：**显式**调用闸门并**打印实际档位/参数**（A3 起四个；
          # A-M12 起追加结构守卫自检，见本步骤末尾）。
          # 此前 CI 只显式接了 verify_close_readiness.py，其余四个只经套件**默认参数**间接运行，
          # 于是"跑的是哪一档"在日志里不可核（实测：card_index 默认档在坏数据上只 WARN ⇒ 套件绿
          # 不能证明卡索引一致）。这里每个闸门都打印它的档位，任一步非零即整步失败（fail-closed）。
          # 与"Offline verify suite"步骤的分工：套件跑**全部** offline 脚本（覆盖自动扩展），
          # 本步骤固化**档位可核**（严格档 + 参数可见）——两侧都保留，不互相替代。
          Write-Host "gate: verify_card_index.py --check --strict  (档位=严格：索引↔卡文件 + 必备节 + 正文分离；阈值取自 agents/policy.json::card_index)"
          python verify/verify_card_index.py --check --strict
          Write-Host "gate: verify_md_tables.py  (档位=默认全扫描集；棘轮基线上限 + review_by 由 agents/policy.json::md_table_legacy_files 决定)"
          python verify/verify_md_tables.py
          Write-Host "gate: verify_no_policy_hardcode.py  (档位=默认仓库全扫 scripts/ + verify/；豁免台账 verify/policy-hardcode-exemptions.json)"
          python verify/verify_no_policy_hardcode.py
          Write-Host "gate: verify_lint.py  (档位=默认 A/B 硬闸门 + C 级只报；规则分级取自 agents/policy.json::lint_rules；ruff pin 见 requirements-windows.txt)"
          python verify/verify_lint.py
          # A-M12（2026-09-25 提前交付，Sprint 归属仍为 Sprint-18/G2）：结构守卫的**自检**档。
          # CI 里没有"编辑前的快照"可比（快照是本地工作流的运行态产物），所以这里只跑 `--replay`：
          # 它在 %TEMP% 的副本上用 5 次 R1 的真实输入复跑，断言每类都被拦下 + 干净副本 rc=0 +
          # 真文件零改动——证明机制本身有效，而不是"声明它有效"。文档集取自
          # agents/policy.json::md_table_docs/md_table_globs（与 verify_md_tables.py 同源）。
          Write-Host "gate: structure-guard.py --replay  (档位=5 类 R1 真实输入复跑自检；不含本地快照比对)"
          python scripts/structure-guard.py --replay

      - name: Build reactflow frontend
        working-directory: paper-qa-script/reactflow-paperqa-prototype/frontend
        run: |
          npm ci
          npm run build

      - name: Build agents-dashboard
        working-directory: agents-dashboard
        # --ignore-scripts：防御性开关（Sprint-10 调研纠偏，3-LEARNED 1.31）——better-sqlite3 v13
        # 无 install script，N-API 预编译随 npm 包分发（prebuilds/ 运行时直载，ABI 无关）；
        # 当前依赖树无任何 install script，此旗标为显式拒绝安装期脚本的无害空操作，保留。
        run: |
          npm ci --ignore-scripts
          npm run build

  e2e-optional:
    # 真实 API 全链路：仅手动触发（workflow_dispatch），需配置仓库 secret DEEPSEEK_API_KEY
    name: E2E with real API (manual only)
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # 035：跑的是 verify_e2e.py（deepseek），直接设 DEEPSEEK_API_KEY（旧写法靠 provider_config
      # 的 OPENAI_API_KEY 回退才生效，命名误导且脆弱）
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python deps
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "2026.1.6.dev10+g36348d0ca"
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          pip install "fhlmi==0.42.1" "litellm==1.76.1"
          pip install -e ./paper-qa
          pip install -e "./paper-qa/packages/paper-qa-pypdf[media]"
          pip install -e ./paper-qa/packages/paper-qa-pymupdf
          pip install -r requirements-windows.txt
      - name: Full pipeline e2e
        env:
          PYTHONUTF8: "1"
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: python verify/verify_e2e.py
