name: CI (offline verify + builds)

on:
  push:
    branches: [main, windows]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同 ref 连续 push 只跑最新（2026-08-31 用户决策：批量 push 节奏下防排队堆积）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Offline suite + builds (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          # 2026-09-25（未闭环核查 O1）：checkout@v4 默认 fetch-depth=1（浅克隆），而关闭前置闸门的
          # C3 覆盖闭环要跑 `git rev-list <锚点>..HEAD`——浅克隆下锚点不可达会直接报错。
          # 填真锚点后该分支首次实跑，故必须取全历史。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python deps (pinned fhlmi/litellm + vendored paper-qa)
        env:
          # vendored paper-qa 无 .git 元数据，setuptools-scm 需显式版本
          SETUPTOOLS_SCM_PRETEND_VERSION: "2026.1.6.dev10+g36348d0ca"
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          pip install "fhlmi==0.42.1" "litellm==1.76.1"
          pip install -e ./paper-qa
          pip install -e "./paper-qa/packages/paper-qa-pypdf[media]"
          pip install -e ./paper-qa/packages/paper-qa-pymupdf
          pip install -r requirements-windows.txt

      - name: Install Graphviz (verify_smoke renders DOT via local Graphviz; cold runner lacks dot)
        run: choco install graphviz -y --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Offline verify suite
        env:
          PYTHONUTF8: "1"
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # TG-5（Sprint-16）：改为经分层 runner 跑 **整个 offline 档**（按 VERIFY_META.tier 自动选择，
          # fail-closed：任一脚本失败即整体失败）——修复此前"新增 offline 脚本忘记登记进 CI"的覆盖缺口
          # （Sprint-15 的 local_dir/f12_preview 与 Sprint-16 的 archive/checkpoint/providers/runner 均因此未进 CI）。
          python verify/run_suite.py --tier offline
          # 矩阵防漂移必须独立执行（verify_matrix.py 自身不参与 tier 选择）
          python verify/verify_matrix.py check

      - name: Close-readiness gate for sprints that claim closure (TG-11)
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # TG-11 ③b/M4：**谁声称已关闭，谁就必须自证**——只校验**真的写了锚点 sha** 的 Sprint 文档
          # （D4：不对历史 Sprint 文档追溯；占位文字如"三查锚点: 待填"不算声明，故用正则而非关键词匹配）。
          # 2026-09-25（code-review-072 C2）：`docs/iteration/sprint/` 是 **windows-only** 目录，
          # main 上没有它——`Get-ChildItem <不存在的目录>` 在 `$ErrorActionPreference = "Stop"` 下抛
          # **终止性** `ItemNotFoundException`（不是"返回空集合"），于是这一步在 main 上恒红。
          # 故先判存在性：不存在 → 显式打印"本分支无 sprint 文档 → 跳过"并 **exit 0**（判据不变，
          # 只是把"没有可校验对象"如实说成跳过，而不是把它伪装成失败）。选择器正则语义**未改动**。
          $sprintGlob = 'docs/iteration/sprint/*sprint-*.md'
          $pat = '三查锚点\s*[:：]\s*`?[0-9a-fA-F]{7,40}'
          $checked = 0
          if (Test-Path 'docs/iteration/sprint') {
            foreach ($f in Get-ChildItem $sprintGlob) {
              if (Select-String -Path $f.FullName -Pattern $pat -Quiet) {
                Write-Host "close-readiness -> $($f.Name)"
                python verify/verify_close_readiness.py --sprint $f.FullName
                # 关闭税读数闸门（TG-19 M-E）：**同一选择器**（声明了真锚点的 Sprint 文档）。
                # 二查 run-…-087 minor 6：它的触发条件是"§9 有 run 行 / 声明真锚点"，此前**没接 CI**，
                # 于是"关闭记录缺机读读数行"只能靠人记得跑。
                Write-Host "close-tax -> $($f.Name)"
                python verify/verify_close_tax_reading.py --sprint $f.FullName
                $checked++
              }
            }
            Write-Host "close-readiness: checked $checked sprint doc(s) declaring a real anchor"
          } else {
            Write-Host "close-readiness: no sprint docs on this branch -> step skipped (docs/iteration/ is windows-only; selector '$sprintGlob' matched nothing)"
          }

      - name: Explicit gate tiers (card index / md tables / policy hardcode / lint / structure guard)
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # A3（finding M-e/M-f/N7，2026-09-25）：**显式**调用闸门并**打印实际档位/参数**（A3 起四个；
          # A-M12 起追加结构守卫自检，见本步骤末尾）。
          # 此前 CI 只显式接了 verify_close_readiness.py，其余四个只经套件**默认参数**间接运行，
          # 于是"跑的是哪一档"在日志里不可核（实测：card_index 默认档在坏数据上只 WARN ⇒ 套件绿
          # 不能证明卡索引一致）。这里每个闸门都打印它的档位，任一步非零即整步失败（fail-closed）。
          # 与"Offline verify suite"步骤的分工：套件跑**全部** offline 脚本（覆盖自动扩展），
          # 本步骤固化**档位可核**（严格档 + 参数可见）——两侧都保留，不互相替代。
          Write-Host "gate: verify_card_index.py --check --strict  (档位=严格：索引↔卡文件 + 必备节 + 正文分离；阈值取自 agents/policy.json::card_index)"
          python verify/verify_card_index.py --check --strict
          Write-Host "gate: verify_md_tables.py  (档位=默认全扫描集；棘轮基线上限 + review_by 由 agents/policy.json::md_table_legacy_files 决定)"
          python verify/verify_md_tables.py
          Write-Host "gate: verify_no_policy_hardcode.py  (档位=默认仓库全扫 scripts/ + verify/；豁免台账 verify/policy-hardcode-exemptions.json)"
          python verify/verify_no_policy_hardcode.py
          Write-Host "gate: verify_lint.py  (档位=默认 A/B 硬闸门 + C 级只报；规则分级取自 agents/policy.json::lint_rules；ruff pin 见 requirements-windows.txt)"
          python verify/verify_lint.py
          # TG-20 ③（2026-09-25 D6）：决策登记册机检——字段齐全 / 受控状态词 / 被取代指向存在的条目 /
          # `path:line` 指针可核 / §4.1 逐字引文↔出处逐条核对。它此前是**纯人工**维护的。
          Write-Host "gate: verify_decision_register.py  (档位=真数据：docs/6-DECISIONS.md；反向对照条数见末行 ALL PASS (N assertions)，标签不写死)"
          python verify/verify_decision_register.py
          # A-M12（2026-09-25 提前交付，Sprint 归属仍为 Sprint-18/G2）：结构守卫的**自检**档。
          # CI 里没有"编辑前的快照"可比（快照是本地工作流的运行态产物），所以这里只跑 `--replay`：
          # 它在 %TEMP% 的副本上复跑 R1 的真实输入 + F2/H1/T1 反向对照，断言每类都被**按期望**处置
          # （该拦下的 rc=1、该放行的 rc=0 且带 [新增]/[修改] 标注）+ 干净副本 rc=0 + 真文件零改动
          # ——证明机制本身有效，而不是"声明它有效"。类别数与断言数**不写死在标签/注释里**：
          # F2/H1/T1 是逐批追加的，写死的数字必然过期（旧文本还停在"5 类 R1"，实际已远超）；
          # 以脚本自报的末行 `ALL PASS (N assertions)` 为准。文档集取自
          # agents/policy.json::md_table_docs/md_table_globs（与 verify_md_tables.py 同源）。
          Write-Host "gate: structure-guard.py --replay  (档位=全类别复跑自检：R1 真实输入 + F2/H1/T1 反向对照；类别数见脚本自报首行、断言数见末行 ALL PASS (N assertions)，标签不写死数字；不含本地快照比对)"
          python scripts/structure-guard.py --replay
          # A-M12 ①（2026-09-25 D4）：结构守卫的**不可跳过层**。上面那档只证明"守卫能拦"，
          # 拦不拦得住取决于"有没有人记得跑"——而这一族事故的根因恰恰是"规则写了没执行"。
          # 故这里用 **git 当基线**复核本次 push 的整个提交范围：不需要任何本地快照
          # （快照是本地运行态），基线来自已经存在的事实。有意删除须在提交信息里署名
          # `Structure-Removal: <路径> :: <理由≥10 字符>`（具名事件；无署名即 FAIL）。
          # 基线取 push 事件的 before（新分支/强推/取不到时回退 HEAD~1）；解析失败由脚本
          # fail-closed 成 rc=2——"比不了"不得伪装成 PASS。
          $guardBase = "${{ github.event.before }}"
          if (-not $guardBase -or $guardBase -match '^0{40}$') { $guardBase = "HEAD~1" }
          # `rev-parse` 在这里是**探测**：非零退出不得让本步骤提前中止（Step 级 fail-closed 由
          # 最后那条 structure-guard 调用负责），故临时关掉原生命令的终止语义，探完立刻还原。
          $prevNative = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          git rev-parse --verify -q "$guardBase^{commit}" *> $null
          $baseOk = ($LASTEXITCODE -eq 0)
          if (-not $baseOk) {
            Write-Host "structure-guard: base '$guardBase' 在本 checkout 里不可解析 → 回退 HEAD~1"
            $guardBase = "HEAD~1"
            git rev-parse --verify -q "HEAD~1^{commit}" *> $null
            $baseOk = ($LASTEXITCODE -eq 0)
          }
          $PSNativeCommandUseErrorActionPreference = $prevNative
          if (-not $baseOk) {
            # 单提交分支（没有父提交）没有可比基线 ⇒ **具名跳过**，不冒充通过
            Write-Host "structure-guard: 本分支没有可解析的父提交（单提交/孤立历史）→ 本步显式跳过（不是通过）"
            # 二查 run-…-088 major：上面两处 `git rev-parse` **探测**失败会把 `$LASTEXITCODE`
            # 留在非零态，而 GH 的 pwsh 模板在步骤末尾 `exit $LASTEXITCODE` ⇒ 日志说"跳过"、
            # 步骤却失败（探针实测 STEP-END last=1）。跳过是**判定结论**，必须显式归零。
            $global:LASTEXITCODE = 0
          } else {
            Write-Host "gate: structure-guard.py verify --from-git $guardBase  (档位=git 基线：本次 push 的提交范围；有意删除须带 Structure-Removal 署名行)"
            python scripts/structure-guard.py verify --from-git $guardBase
          }

      - name: Build reactflow frontend
        working-directory: paper-qa-script/reactflow-paperqa-prototype/frontend
        run: |
          npm ci
          npm run build

      - name: Build agents-dashboard
        working-directory: agents-dashboard
        # --ignore-scripts：防御性开关（Sprint-10 调研纠偏，3-LEARNED 1.31）——better-sqlite3 v13
        # 无 install script，N-API 预编译随 npm 包分发（prebuilds/ 运行时直载，ABI 无关）；
        # 当前依赖树无任何 install script，此旗标为显式拒绝安装期脚本的无害空操作，保留。
        run: |
          npm ci --ignore-scripts
          npm run build

  e2e-optional:
    # 真实 API 全链路：仅手动触发（workflow_dispatch），需配置仓库 secret DEEPSEEK_API_KEY
    name: E2E with real API (manual only)
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # 035：跑的是 verify_e2e.py（deepseek），直接设 DEEPSEEK_API_KEY（旧写法靠 provider_config
      # 的 OPENAI_API_KEY 回退才生效，命名误导且脆弱）
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          # 同上（e2e 手动作业）：全历史，避免锚点不可达。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python deps
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "2026.1.6.dev10+g36348d0ca"
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          pip install "fhlmi==0.42.1" "litellm==1.76.1"
          pip install -e ./paper-qa
          pip install -e "./paper-qa/packages/paper-qa-pypdf[media]"
          pip install -e ./paper-qa/packages/paper-qa-pymupdf
          pip install -r requirements-windows.txt
      - name: Full pipeline e2e
        env:
          PYTHONUTF8: "1"
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: python verify/verify_e2e.py
